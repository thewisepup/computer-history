name: Fix merge conflicts

# Merges the base into open pull requests that conflict, using Claude Code.
# Claude's code never shares a runner with a secret, and only `land` pushes:
#   find -> sonnet -> check-sonnet -> [opus -> check-opus] -> land
# `sonnet`/`opus` hold the OAuth token, run Claude with file tools only, and
# upload the files it changed. `check-*` hold no secret: they apply those
# files, run ruff and tests/unit, and bundle the merge commit. `land` runs no
# AI or repository code: it checks the bundle, turns off auto-merge, pushes
# and comments. docs/agents/checks.md has the flow.

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to fix
        required: true

permissions: {}

concurrency:
  group: fix-conflicts-${{ inputs.pr || github.run_id }}
  cancel-in-progress: false

jobs:
  find:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      actions: write
    outputs:
      prs: ${{ steps.find.outputs.prs }}
      pr: ${{ steps.find.outputs.pr }}
      head: ${{ steps.find.outputs.head }}
      base: ${{ steps.find.outputs.base }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ inputs.pr }}
        run: |
          if [ -n "$PR" ]; then
            numbers="$PR"
          else
            numbers=$(gh pr list --repo "$REPO" --base "$BASE" --state open --limit 200 --json number --jq '.[].number')
            # GitHub works out mergeability a few seconds after a push.
            [ -n "$numbers" ] && sleep 20
          fi
          prs='[]'
          for n in $numbers; do
            for _ in 1 2 3 4 5 6; do
              info=$(gh pr view "$n" --repo "$REPO" --json number,headRefName,baseRefName,mergeable,isCrossRepository,labels,author) || info='{"mergeable":"UNKNOWN"}'
              [ "$(jq -r .mergeable <<<"$info")" != UNKNOWN ] && break
              sleep 10
            done
            echo "#$n: $(jq -r .mergeable <<<"$info")"
            jq -e --arg owner "$OWNER" '.mergeable == "CONFLICTING" and (.isCrossRepository | not) and .author.login == $owner' <<<"$info" >/dev/null || continue
            if [ -n "$PR" ]; then
              prs=$(jq -c '[{number, head: .headRefName, base: .baseRefName}]' <<<"$info")
            elif jq -e '[.labels[].name] | index("no-autofix") | not' <<<"$info" >/dev/null; then
              # The Claude action only runs on workflow_dispatch, from the default branch's copy.
              gh workflow run fix-conflicts.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" -f pr="$n" \
                || echo "::warning::could not start a fix for #$n"
            fi
          done
          {
            echo "prs=$prs"
            echo "pr=$(jq -r '.[0].number // empty' <<<"$prs")"
            echo "head=$(jq -r '.[0].head // empty' <<<"$prs")"
            echo "base=$(jq -r '.[0].base // empty' <<<"$prs")"
          } >> "$GITHUB_OUTPUT"

  # Claude with Read, Edit, Write, Glob and Grep only: no shell, so nothing it
  # writes runs on this runner. Its job token is read-only, and the action
  # embeds it in the origin URL, where Claude can read it.
  sonnet:
    needs: find
    if: github.event_name == 'workflow_dispatch' && needs.find.outputs.pr != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
    env:
      PR: ${{ needs.find.outputs.pr }}
      HEAD_BRANCH: ${{ needs.find.outputs.head }}
      BASE_BRANCH: ${{ needs.find.outputs.base }}
      ATTEMPT: sonnet
      MODEL: claude-sonnet-5-5
      EFFORT: medium
      TURNS: "60"
      # Read by the Claude action: strips secrets from the environment of
      # anything Claude starts, in a PID namespace through bubblewrap.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps: &attempt-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.HEAD_BRANCH }}
          fetch-depth: 0
          persist-credentials: false

      # The Claude action installs these only with allowed_non_write_users.
      - name: Install subprocess isolation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Start the merge
        id: merge
        run: |
          git config user.name "claude[bot]"
          git config user.email "209825114+claude[bot]@users.noreply.github.com"
          git merge --no-ff --no-commit "origin/$BASE_BRANCH" || true
          files=$(git diff --name-only --diff-filter=U)
          echo "conflicts=$(tr '\n' ' ' <<<"$files" | sed 's/ $//')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: env.ATTEMPT == 'opus'
        continue-on-error: true
        with:
          name: check-sonnet
          path: ${{ runner.temp }}/first

      # Claude has no git: each side of every conflict, and its history, as files.
      - name: Lay out both sides
        if: steps.merge.outputs.conflicts != ''
        run: |
          ctx=.conflict-context
          mkdir -p "$ctx"
          echo "/$ctx/" >> .git/info/exclude
          mb=$(git merge-base HEAD "origin/$BASE_BRANCH")
          files=()
          while IFS= read -r -d '' f; do files+=("$f"); done < <(git diff --name-only --diff-filter=U -z)
          for f in "${files[@]}"; do
            for side in 1:base 2:ours 3:theirs; do
              dest="$ctx/${side#*:}/$f"
              mkdir -p "$(dirname "$dest")"
              git show ":${side%%:*}:$f" > "$dest" 2>/dev/null || rm -f "$dest"
            done
          done
          {
            echo "# $HEAD_BRANCH (ours) since it split from $BASE_BRANCH, touching the conflicted files"
            git log --format='%h %ad %s' --date=short "$mb..HEAD" -- "${files[@]}"
            echo
            echo "# $BASE_BRANCH (theirs) since the split"
            git log --format='%h %ad %s' --date=short "$mb..origin/$BASE_BRANCH" -- "${files[@]}"
          } > "$ctx/history.txt"
          git diff "$mb" HEAD -- "${files[@]}" > "$ctx/ours.diff"
          git diff "$mb" "origin/$BASE_BRANCH" -- "${files[@]}" > "$ctx/theirs.diff"
          first="$RUNNER_TEMP/first"
          if [ "$ATTEMPT" = opus ]; then
            {
              echo "The first attempt stopped: $(head -c 20 "$first/reason" 2>/dev/null || echo unknown)."
              if [ -f "$first/report.md" ]; then echo; echo "Its report:"; cat "$first/report.md"; fi
              if [ -f "$first/checks.log" ]; then echo; echo "The last lines of the check that failed:"; cat "$first/checks.log"; fi
            } > "$ctx/first-attempt.md"
          fi
          # What Claude changes is found by comparing against this copy.
          mkdir -p "$RUNNER_TEMP/before"
          tar -C . --exclude=./.git --exclude="./$ctx" -cf - . | tar -C "$RUNNER_TEMP/before" -xf -

      - name: Write the prompt
        id: prompt
        if: steps.merge.outputs.conflicts != ''
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          {
            echo 'text<<PROMPT_END'
            cat <<EOF
          This checkout is branch \`$HEAD_BRANCH\` of pull request #$PR, in the middle of
          merging \`$BASE_BRANCH\` into it. These files have conflict markers: $CONFLICTS

          You have file tools and no shell. \`.conflict-context/\` holds, for each conflicted
          file, \`base/<path>\` (the version both sides started from), \`ours/<path>\` (this
          branch) and \`theirs/<path>\` (\`$BASE_BRANCH\`), plus \`history.txt\` (each side's
          commits since they split), \`ours.diff\` and \`theirs.diff\` (each side's change).
          If \`.conflict-context/first-attempt.md\` exists, an earlier attempt failed: read it
          first. Don't edit anything under \`.conflict-context/\`.

          Resolve the merge so the branch keeps what both sides meant:
          1. For each conflicted file, read both sides and the surrounding code, and write
             the version that keeps both changes, with no conflict markers left. Taking one
             side whole is right only when the other side's change is already included or was
             deliberately removed.
          2. Fix anything else the merge broke, such as callers of a renamed function. You
             can't run anything, so read the code. A later step runs \`ruff format\`,
             \`ruff check\` and \`tests/unit\`, and commits and pushes only if they pass.

          Stop without resolving when a conflict is a real disagreement about behaviour (both
          sides changed the same logic in different directions), or a conflicted file is under
          \`.github/\`, \`.githooks/\` or \`.claude/\`, which need a person. Then write
          \`.conflict-report.md\` at the repository root: for each file, one bullet on what each
          side changed and why they could not be combined. Plain text, at most 40 lines: it is
          posted on the pull request.
          EOF
            echo 'PROMPT_END'
          } >> "$GITHUB_OUTPUT"

      - name: Resolve
        if: steps.merge.outputs.conflicts != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          # `find` dispatches this run with GITHUB_TOKEN, so the actor is github-actions[bot].
          allowed_bots: github-actions
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model ${{ env.MODEL }} --effort ${{ env.EFFORT }} --max-turns ${{ env.TURNS }}
            --permission-mode acceptEdits
            --allowedTools "Read,Edit,Write,Glob,Grep"
            --disallowedTools "Bash,WebFetch,WebSearch,Edit(.git/**),Edit(.github/**),Edit(.githooks/**),Edit(.claude/**),Edit(.conflict-context/**),Read(//proc/**)"

      # Coreutils only: nothing from the checkout runs while the token is here.
      - name: Collect what Claude changed
        if: always() && steps.merge.outputs.conflicts != ''
        run: |
          before="$RUNNER_TEMP/before"
          work="$RUNNER_TEMP/work"
          mkdir -p "$work/files"
          # Claude may not edit .claude/, so anything there came from the action.
          find . \( -path ./.git -o -path ./.conflict-context -o -path ./.claude \) -prune -o -type f -print0 |
            while IFS= read -r -d '' f; do
              if ! cmp -s "$f" "$before/$f"; then
                echo "$f"
                mkdir -p "$work/files/$(dirname "$f")"
                cp "$f" "$work/files/$f"
              fi
            done
          touch "$work/done"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.merge.outputs.conflicts != ''
        with:
          name: attempt-${{ env.ATTEMPT }}
          path: ${{ runner.temp }}/work
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # No secret and a read-only token: Claude's files and the repository's
  # tests run here.
  check-sonnet:
    needs: [find, sonnet]
    if: ${{ !cancelled() && needs.sonnet.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      retry: ${{ steps.check.outputs.retry }}
    env:
      PR: ${{ needs.find.outputs.pr }}
      HEAD_BRANCH: ${{ needs.find.outputs.head }}
      BASE_BRANCH: ${{ needs.find.outputs.base }}
      ATTEMPT: sonnet
    steps: &check-steps
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.HEAD_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv pip install --system -e '.[test,dev]'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: attempt-${{ env.ATTEMPT }}
          path: ${{ runner.temp }}/work

      - name: Apply and check
        id: check
        run: |
          out="$RUNNER_TEMP/out"
          log="$out/checks.log"
          mkdir -p "$out"
          stop() {
            trap - ERR
            echo needs-you > "$out/status"
            echo "$1" > "$out/reason"
            echo "Stopped: $1"
            echo "retry=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          trap 'stop crashed' ERR
          git config user.name "claude[bot]"
          git config user.email "209825114+claude[bot]@users.noreply.github.com"
          git merge --no-ff --no-commit "origin/$BASE_BRANCH" > /dev/null 2>&1 || true
          if [ -z "$(git diff --name-only --diff-filter=U)" ]; then
            echo clean > "$out/status"
            echo "retry=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          work="$RUNNER_TEMP/work/files"
          [ -f "$RUNNER_TEMP/work/done" ] || stop stopped
          if [ -d "$work" ]; then
            [ -z "$(find "$work" ! -type f ! -type d)" ] || stop shape
            [ ! -e "$work/.git" ] || stop shape
            cp -R "$work/." .
          fi
          if [ -f .conflict-report.md ]; then
            mv .conflict-report.md "$out/report.md"
            stop report
          fi
          git add -A
          [ -z "$(git diff --cached --name-only --diff-filter=U)" ] || stop unmerged
          if grep -qE '^\+(<<<<<<<|>>>>>>>)( |$)' <(git diff --cached HEAD); then stop markers; fi
          if ! git diff --cached --quiet HEAD -- pyproject.toml; then
            uv pip install --system -e '.[test,dev]' > "$log" 2>&1 || stop install
          fi
          python -m ruff format computer_history tests > "$log" 2>&1 || stop ruff
          git add -A
          python -m ruff check computer_history tests > "$log" 2>&1 || stop ruff
          TMPDIR=/dev/shm python -m pytest -q -n auto tests/unit > "$log" 2>&1 || stop tests
          git commit -q --no-verify -m "Merge $BASE_BRANCH into $HEAD_BRANCH"
          if grep -qE 'sk-ant-|gh[opsu]_[A-Za-z0-9]{20}|github_pat_' <(git diff-tree --cc --no-commit-id -p HEAD); then
            stop secret
          fi
          git bundle create "$out/fix.bundle" HEAD "^origin/$HEAD_BRANCH" "^origin/$BASE_BRANCH"
          rm -f "$log"
          echo resolved > "$out/status"
          echo "$ATTEMPT" > "$out/model"
          echo "retry=false" >> "$GITHUB_OUTPUT"

      # `land` treats everything here as untrusted and checks it again.
      - name: Package the result
        if: always()
        run: |
          out="$RUNNER_TEMP/out"
          mkdir -p "$out"
          if [ ! -f "$out/status" ]; then
            echo needs-you > "$out/status"
            echo crashed > "$out/reason"
          fi
          if [ -f "$out/checks.log" ]; then
            tail -n 40 "$out/checks.log" > "$out/checks.tail" && mv "$out/checks.tail" "$out/checks.log"
          fi
          for f in "$out/report.md" "$out/checks.log"; do
            if [ -f "$f" ]; then sed -E -i 's/(sk-ant-|gh[opsu]_|github_pat_)[A-Za-z0-9_-]+/[redacted]/g' "$f"; fi
          done
          ls -l "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: check-${{ env.ATTEMPT }}
          path: ${{ runner.temp }}/out
          retention-days: 1
          if-no-files-found: error

  opus:
    needs: [find, check-sonnet]
    if: ${{ !cancelled() && needs.check-sonnet.outputs.retry == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    env:
      PR: ${{ needs.find.outputs.pr }}
      HEAD_BRANCH: ${{ needs.find.outputs.head }}
      BASE_BRANCH: ${{ needs.find.outputs.base }}
      ATTEMPT: opus
      MODEL: claude-opus-5-5
      EFFORT: high
      TURNS: "80"
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps: *attempt-steps

  check-opus:
    needs: [find, opus]
    if: ${{ !cancelled() && needs.opus.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      retry: ${{ steps.check.outputs.retry }}
    env:
      PR: ${{ needs.find.outputs.pr }}
      HEAD_BRANCH: ${{ needs.find.outputs.head }}
      BASE_BRANCH: ${{ needs.find.outputs.base }}
      ATTEMPT: opus
    steps: *check-steps

  land:
    needs: [find, check-sonnet, check-opus]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && needs.find.outputs.pr != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Runs no AI and none of the repository's code.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: write # delete the artifacts once done
      id-token: write # exchanged for the Claude app's token, so the push starts CI
    env:
      PR: ${{ needs.find.outputs.pr }}
      HEAD_BRANCH: ${{ needs.find.outputs.head }}
      BASE_BRANCH: ${{ needs.find.outputs.base }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.HEAD_BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: check-sonnet
          path: ${{ runner.temp }}/check-sonnet
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.check-opus.result != 'skipped'
        continue-on-error: true
        with:
          name: check-opus
          path: ${{ runner.temp }}/check-opus

      - name: Check and push
        id: land
        env:
          SECRET: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          pkg="$RUNNER_TEMP/check-sonnet"
          if [ -f "$RUNNER_TEMP/check-opus/status" ]; then pkg="$RUNNER_TEMP/check-opus"; fi
          echo "pkg=$pkg" >> "$GITHUB_OUTPUT"
          finish() {
            echo "outcome=$1" >> "$GITHUB_OUTPUT"
            echo "why=$2" >> "$GITHUB_OUTPUT"
            echo "$1 ${2:-}"
            exit 0
          }
          files=$(git merge-tree --write-tree --name-only --no-messages "origin/$HEAD_BRANCH" "origin/$BASE_BRANCH" | tail -n +2 | tr -d '`' | sort -u | head -n 20 | paste -sd ' ' - || true)
          echo "files=$files" >> "$GITHUB_OUTPUT"
          case "$(head -c 20 "$pkg/status" 2>/dev/null)" in
            clean) finish clean "" ;;
            resolved) ;;
            needs-you)
              reason=$(head -c 20 "$pkg/reason" 2>/dev/null || true)
              case "$reason" in
                report) finish needs-you report ;;
                unmerged | markers) finish needs-you unresolved ;;
                install | ruff | tests) finish needs-you "checks-$reason" ;;
                secret) finish needs-you secret ;;
                shape) finish needs-you shape ;;
                crashed) finish needs-you crashed ;;
                *) finish needs-you stopped ;;
              esac ;;
            *) finish needs-you broken ;;
          esac
          case "$(head -c 20 "$pkg/model" 2>/dev/null)" in
            sonnet) echo "model=Sonnet 5.5" >> "$GITHUB_OUTPUT" ;;
            opus) echo "model=Opus 5.5" >> "$GITHUB_OUTPUT" ;;
            *) echo "model=Claude" >> "$GITHUB_OUTPUT" ;;
          esac

          git bundle verify -q "$pkg/fix.bundle" > /dev/null 2>&1 || finish needs-you moved
          git fetch -q "$pkg/fix.bundle" HEAD:refs/fix/result
          result=$(git rev-parse refs/fix/result)
          [ "$(git rev-list --parents -n 1 "$result" | wc -w)" -eq 3 ] || finish needs-you shape
          [ "$(git rev-parse "$result^1")" = "$(git rev-parse "origin/$HEAD_BRANCH")" ] || finish needs-you moved
          git merge-base --is-ancestor "$result^2" "origin/$BASE_BRANCH" || finish needs-you shape
          # The combined diff holds only what the resolution wrote itself: lines
          # and files that match neither side.
          cc="$RUNNER_TEMP/resolution.patch"
          git diff-tree --cc --no-commit-id -p "$result" > "$cc"
          if grep -qE '^\+\+(<<<<<<<|>>>>>>>)( |$)' "$cc"; then finish needs-you unresolved; fi
          if git diff-tree --cc --no-commit-id --name-only "$result" | grep -qE '^\.(github|githooks|claude)/'; then
            finish needs-you protected
          fi
          if { [ -n "$SECRET" ] && grep -qF -- "$SECRET" "$cc"; } || grep -qE 'sk-ant-|gh[opsu]_[A-Za-z0-9]{20}|github_pat_' "$cc"; then
            finish needs-you secret
          fi

          # The Claude app's token, as the Claude action gets it (src/github/token.ts).
          oidc=$(curl -q -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claude-code-github-action" | jq -r '.value // empty') || true
          [ -n "$oidc" ] || finish needs-you token
          echo "::add-mask::$oidc"
          app=$(curl -q -sSf -X POST -H "Authorization: Bearer $oidc" \
            https://api.anthropic.com/api/github/github-app-token-exchange | jq -r '.token // .app_token // empty') || true
          [ -n "$app" ] || finish needs-you token
          echo "::add-mask::$app"
          trap 'curl -q -sS -o /dev/null -X DELETE -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $app" https://api.github.com/installation/token || true' EXIT

          # Before the push, so the merge can't land before anyone reads it.
          auto=$(GH_TOKEN="$app" gh pr view "$PR" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null') \
            || finish needs-you automerge
          if [ "$auto" = true ]; then
            GH_TOKEN="$app" gh pr merge "$PR" --repo "$REPO" --disable-auto || finish needs-you automerge
            echo "auto=off" >> "$GITHUB_OUTPUT"
          fi

          auth=$(printf 'x-access-token:%s' "$app" | base64 -w0)
          echo "::add-mask::$auth"
          # No + and no --force: a branch that moved meanwhile rejects the push.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push -q origin "$result:refs/heads/$HEAD_BRANCH" || finish needs-you rejected
          finish pushed ""

      - name: Comment
        id: comment
        if: ${{ !cancelled() && steps.land.outputs.outcome != 'clean' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ steps.land.outputs.pkg }}
          OUTCOME: ${{ steps.land.outputs.outcome }}
          WHY: ${{ steps.land.outputs.why }}
          FILES: ${{ steps.land.outputs.files }}
          MODEL: ${{ steps.land.outputs.model }}
          AUTO: ${{ steps.land.outputs.auto }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          files=${FILES// /\`, \`}
          files=${files:-the conflicted files}
          # Claude's text goes out only redacted, in a code block, and cut short.
          quote() {
            python3 -I - "$1" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          text = re.sub(r"[^\t\n\x20-\x7e]", "?", text)
          text = re.sub(r"(sk-ant-|gh[opsu]_|github_pat_)[\w-]+", "[redacted]", text)
          text = re.sub(r"(?=[\w+/=-]*[A-Z])(?=[\w+/=-]*[a-z])(?=[\w+/=-]*[0-9])[\w+/=-]{32,}", "[redacted]", text)
          text = text.replace("`", "'")
          body = "\n".join(text.splitlines()[:40])[:3000]
          print("```text\n" + body + "\n```")
          PY
          }
          if [ "$OUTCOME" = pushed ]; then
            {
              echo "Merged \`$BASE_BRANCH\` into this branch and resolved conflicts in \`$files\` ($MODEL). Ruff and \`tests/unit\` passed in the fixer's run before the push; CI is checking the rest."
              echo
              if [ "$AUTO" = off ]; then
                echo "**Needs your review:** Claude wrote this merge commit, so auto-merge was turned off. Read the merge commit's diff, then merge by hand or turn auto-merge back on. [Workflow run]($RUN_URL)."
              else
                echo "**Needs your review:** Claude wrote this merge commit. Read its diff before merging. [Workflow run]($RUN_URL)."
              fi
            } > "$RUNNER_TEMP/comment.md"
            gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          check=${WHY#checks-}
          [ "$check" = tests ] && check=tests/unit
          case "$WHY" in
            report) why="merging \`$BASE_BRANCH\` into this branch has conflicts that need a decision, in \`$files\`. Claude's notes:" ;;
            unresolved) why="the fixer left conflicts unresolved in \`$files\`." ;;
            checks-*) why="the conflicts in \`$files\` were resolved, but \`$check\` failed afterwards. Its last lines:" ;;
            secret) why="the resolution of \`$files\` looked like it held a secret, so it was dropped." ;;
            protected) why="resolving \`$files\` meant writing new content under \`.github/\`, \`.githooks/\` or \`.claude/\`, which needs a person." ;;
            moved) why="the branch or \`$BASE_BRANCH\` moved while the fixer ran." ;;
            shape) why="the fixer's result wasn't a merge of this branch and \`$BASE_BRANCH\`." ;;
            crashed) why="a step of the fixer's checks failed unexpectedly while handling \`$files\`." ;;
            token) why="the fixer couldn't get the Claude app's token to push." ;;
            automerge) why="the fixer couldn't turn off auto-merge, so it didn't push." ;;
            rejected) why="the push was rejected, most likely because someone pushed to the branch meanwhile." ;;
            *) why="the conflict fixer stopped without resolving \`$files\`." ;;
          esac
          {
            echo "**Needs you:** $why"
            echo
            if [ "$WHY" = report ] && [ -f "$PKG/report.md" ]; then quote "$PKG/report.md"; echo; fi
            if [ "${WHY#checks-}" != "$WHY" ] && [ -f "$PKG/checks.log" ]; then quote "$PKG/checks.log"; echo; fi
            if [ "$AUTO" = off ]; then echo "Auto-merge was turned off."; fi
            echo "Nothing was pushed. See the [workflow run]($RUN_URL)."
            echo
            echo "Labelled \`no-autofix\` so later pushes skip this PR. To try again: \`gh workflow run fix-conflicts.yml -f pr=$PR\`."
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --repo "$REPO" --body-file "$RUNNER_TEMP/comment.md"
          gh pr edit "$PR" --repo "$REPO" --add-label no-autofix || true
          exit 1

      # Last, and only once the outcome is posted, so re-running a `land` that
      # broke earlier still finds them.
      - name: Delete the artifacts
        if: ${{ always() && (steps.land.outputs.outcome == 'clean' || steps.comment.outcome == 'success' || steps.comment.outcome == 'failure') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[].id' |
            while read -r id; do gh api -X DELETE "repos/$REPO/actions/artifacts/$id"; done

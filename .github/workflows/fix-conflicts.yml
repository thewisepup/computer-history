name: Fix merge conflicts

# When a branch moves, open pull requests based on it that now conflict get
# the base merged in by Claude Code. A conflict that needs a human gets a
# comment instead of a push. Label a pull request `no-autofix` to opt it out.

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to fix
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  find:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prs: ${{ steps.find.outputs.prs }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.ref_name }}
          PR: ${{ inputs.pr }}
        run: |
          if [ -n "$PR" ]; then
            numbers="$PR"
          else
            numbers=$(gh pr list --repo "$REPO" --base "$BASE" --state open --json number --jq '.[].number')
            # GitHub works out mergeability a few seconds after a push.
            [ -n "$numbers" ] && sleep 20
          fi
          prs='[]'
          for n in $numbers; do
            for _ in 1 2 3 4 5 6; do
              info=$(gh pr view "$n" --repo "$REPO" --json number,headRefName,baseRefName,mergeable,isCrossRepository,labels)
              [ "$(jq -r .mergeable <<<"$info")" != UNKNOWN ] && break
              sleep 10
            done
            echo "#$n: $(jq -r .mergeable <<<"$info")"
            jq -e '.mergeable == "CONFLICTING" and (.isCrossRepository | not)
                   and ([.labels[].name] | index("no-autofix") | not)' <<<"$info" >/dev/null || continue
            prs=$(jq -c --argjson p "$(jq -c '{number, head: .headRefName, base: .baseRefName}' <<<"$info")" '. + [$p]' <<<"$prs")
          done
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

  fix:
    needs: find
    if: needs.find.outputs.prs != '[]' && needs.find.outputs.prs != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJSON(needs.find.outputs.prs) }}
    concurrency:
      group: fix-conflicts-${{ matrix.pr.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ matrix.pr.number }}
      HEAD_BRANCH: ${{ matrix.pr.head }}
      BASE_BRANCH: ${{ matrix.pr.base }}
      REPORT: ${{ github.workspace }}/.conflict-report.md
    steps:
      # No persisted GITHUB_TOKEN: its pushes would not start CI on the fix.
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.pr.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test,dev]'

      - name: Start the merge
        id: merge
        run: |
          git config user.name "claude[bot]"
          git config user.email "209825114+claude[bot]@users.noreply.github.com"
          git merge --no-ff --no-commit "origin/$BASE_BRANCH" || true
          files=$(git diff --name-only --diff-filter=U)
          if [ -z "$files" ]; then
            echo "No conflicts with origin/$BASE_BRANCH any more."
            echo "conflicts=" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts=$(tr '\n' ' ' <<<"$files" | sed 's/ $//')" >> "$GITHUB_OUTPUT"
          fi

      - name: Write the prompt
        id: prompt
        if: steps.merge.outputs.conflicts != ''
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        run: |
          {
            echo 'text<<PROMPT_END'
            cat <<EOF
          This checkout is branch \`$HEAD_BRANCH\` of pull request #$PR, in the middle of
          \`git merge origin/$BASE_BRANCH\`. These files have conflicts: $CONFLICTS

          If \`.conflict-first-attempt.md\` exists, an earlier attempt failed and left that
          report: read it first, and delete it before you commit.

          Finish the merge so the branch keeps what both sides meant:
          1. For each conflicted file, read both sides and the surrounding code, and write the
             version that keeps both changes. Taking one side whole is right only when the other
             side's change is already included or was deliberately removed.
          2. Run \`python -m ruff format computer_history tests\`, then
             \`python -m ruff check computer_history tests\` and \`python -m pytest -q tests/unit\`.
             Fix anything the merge broke.
          3. When no conflict markers are left and both checks pass:
             \`git add -A\`, \`git commit -m "Merge $BASE_BRANCH into $HEAD_BRANCH"\`,
             \`git push origin HEAD:$HEAD_BRANCH\`.

          Stop without committing when a conflict is a real disagreement about behaviour (both
          sides changed the same logic in different directions), or the checks still fail after
          the merge is resolved. Then write \`.conflict-report.md\` at the repository root: for
          each file, one bullet on what each side changed and why they could not be combined,
          and the failing check's last lines. Leave that file uncommitted.
          EOF
            echo 'PROMPT_END'
          } >> "$GITHUB_OUTPUT"

      - name: Resolve (Sonnet)
        if: steps.merge.outputs.conflicts != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model claude-sonnet-5-5 --effort medium --max-turns 60
            --permission-mode acceptEdits
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(python -m ruff:*),Bash(python -m pytest:*)"

      - name: Check the push
        id: first
        if: steps.merge.outputs.conflicts != ''
        run: |
          git fetch -q origin "$HEAD_BRANCH"
          if git merge-base --is-ancestor "origin/$BASE_BRANCH" "origin/$HEAD_BRANCH"; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
          else
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            [ -f "$REPORT" ] && cp "$REPORT" "$RUNNER_TEMP/first-report.md"
            git merge --abort 2>/dev/null || git reset -q --hard HEAD
            git clean -fdq
            git merge --no-ff --no-commit "origin/$BASE_BRANCH" || true
            [ -f "$RUNNER_TEMP/first-report.md" ] && cp "$RUNNER_TEMP/first-report.md" .conflict-first-attempt.md
            true
          fi

      - name: Resolve (Opus)
        if: steps.first.outputs.resolved == 'false'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --model claude-opus-5-5 --effort high --max-turns 80
            --permission-mode acceptEdits
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(python -m ruff:*),Bash(python -m pytest:*)"

      - name: Report
        if: always() && steps.merge.outputs.conflicts != ''
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          FIRST: ${{ steps.first.outputs.resolved }}
        run: |
          git fetch -q origin "$HEAD_BRANCH"
          files=${CONFLICTS// /\`, \`}
          if git merge-base --is-ancestor "origin/$BASE_BRANCH" "origin/$HEAD_BRANCH"; then
            model=$([ "$FIRST" = true ] && echo "Sonnet 5.5" || echo "Opus 5.5")
            gh pr comment "$PR" --body "Merged \`$BASE_BRANCH\` into this branch and resolved conflicts in \`$files\` ($model). Ruff and \`tests/unit\` passed before the push; CI is checking the rest."
          else
            {
              echo "**Needs you:** merging \`$BASE_BRANCH\` into this branch has conflicts I could not resolve safely, in \`$files\`. Nothing was pushed."
              echo
              [ -f "$REPORT" ] && cat "$REPORT" || echo "No report was written; see the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            } > "$RUNNER_TEMP/comment.md"
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
            exit 1
          fi

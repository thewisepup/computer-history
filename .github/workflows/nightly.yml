name: Nightly performance

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      COMPUTER_HISTORY_DATASET_CACHE: /home/runner/.cache/computer-history/datasets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Make room for a year
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / /mnt
          free -h
      - name: Performance gate on the nightly datasets
        run: |
          set -o pipefail
          /usr/bin/time -v -o nightly-time.txt \
            computer-history dev perf --dataset day --dataset year --dataset heavy-month \
            --counters nightly-counters.json | tee nightly-gate.txt
      - name: Wall-clock benchmark
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          computer-history dev bench | tee nightly-bench.txt
      - if: always()
        run: |
          grep -E "Elapsed|Maximum resident" nightly-time.txt || true
          df -h / /mnt
          du -sh "$COMPUTER_HISTORY_DATASET_CACHE"/* || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-perf
          path: |
            nightly-counters.json
            nightly-gate.txt
            nightly-time.txt
            nightly-bench.txt
          if-no-files-found: ignore

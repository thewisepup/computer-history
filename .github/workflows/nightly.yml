name: Nightly

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

jobs:
  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      COMPUTER_HISTORY_DATASET_CACHE: /home/runner/.cache/computer-history/datasets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - run: |
          df -h /
          free -h
      - name: Performance gate on the nightly datasets
        run: |
          set -o pipefail
          /usr/bin/time -v -o nightly-time.txt \
            computer-history dev perf --dataset day --dataset year --dataset heavy-year \
            --counters nightly-counters.json | tee nightly-gate.txt
      - name: Wall-clock medians (no baseline on CI, so nothing is compared)
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          computer-history dev bench | tee nightly-bench.txt
      - if: always()
        run: |
          grep -E "Elapsed|Maximum resident" nightly-time.txt || true
          df -h /
          du -sh "$COMPUTER_HISTORY_DATASET_CACHE"/* || true
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-perf
          path: |
            nightly-counters.json
            nightly-gate.txt
            nightly-time.txt
            nightly-bench.txt
          if-no-files-found: ignore

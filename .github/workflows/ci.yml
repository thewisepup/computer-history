name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[test,dev]'
      - run: python -m ruff check computer_history tests
      - run: python -m pytest -q
      - run: python -m unittest -q

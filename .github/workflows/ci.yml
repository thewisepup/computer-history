name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test,dev]'
      - run: python -m ruff check computer_history tests
      - run: python -m pytest -q
      - run: python -m unittest -q

  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPUTER_HISTORY_DATASET_CACHE: /home/runner/.cache/computer-history/datasets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - id: datasets
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.COMPUTER_HISTORY_DATASET_CACHE }}
          key: datasets-${{ env.ImageOS }}-${{ env.ImageVersion }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('computer_history/**/*.py', 'computer_history/**/*.sql') }}
      - name: Performance gate
        run: |
          set -o pipefail
          computer-history dev perf --counters perf-counters.json | tee perf-gate.txt
      - if: always() && steps.datasets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.COMPUTER_HISTORY_DATASET_CACHE }}
          key: ${{ steps.datasets.outputs.cache-primary-key }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-counters
          path: |
            perf-counters.json
            perf-gate.txt
          if-no-files-found: ignore

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

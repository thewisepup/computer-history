name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv pip install --system -e '.[test,dev]'
      - run: python -m ruff check computer_history tests
      - run: python -m ruff format --check computer_history tests

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv pip install --system -e '.[test,dev]'
      - run: python -m pytest -q -n auto tests/unit
        env:
          TMPDIR: /dev/shm

  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv pip install --system -e '.[test,dev]'
      - run: python -m pytest -q -n auto --dist worksteal tests/data

  poc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv pip install --system -e '.[test,dev]'
      - run: python -m unittest -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv pip install --system -e '.[test,dev]'
      - run: python -m pyright --pythonpath "$(command -v python)"

  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPUTER_HISTORY_DATASET_CACHE: /home/runner/.cache/computer-history/datasets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        id: python
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: uv pip install --system -e .
      - id: runner
        run: |
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "sqlite=$(python -c 'import sqlite3; print(sqlite3.sqlite_version)')" >> "$GITHUB_OUTPUT"
      - id: datasets
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.COMPUTER_HISTORY_DATASET_CACHE }}
          key: datasets-${{ steps.runner.outputs.image }}-py${{ steps.python.outputs.python-version }}-sqlite${{ steps.runner.outputs.sqlite }}-${{ hashFiles('computer_history/**/*.py', 'computer_history/**/*.sql') }}
      - name: Performance gate
        run: |
          set -o pipefail
          computer-history dev perf --counters perf-counters.json | tee perf-gate.txt
        env:
          TMPDIR: /dev/shm
      - if: failure()
        run: >-
          echo "::notice title=Performance gate::If the change of cost is intended and only
          VM steps fail (a local update keeps them, since they differ between SQLite versions),
          take this run's counters as the baseline: gh run download ${{ github.run_id }}
          -n perf-counters -D /tmp/perf, then copy /tmp/perf/perf-counters.json over the
          file the log's "Baseline" line names."
      - if: "!cancelled() && steps.datasets.outputs.cache-hit != 'true' && hashFiles('perf-counters.json') != ''"
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.COMPUTER_HISTORY_DATASET_CACHE }}
          key: ${{ steps.datasets.outputs.cache-primary-key }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: perf-counters
          path: |
            perf-counters.json
            perf-gate.txt
          if-no-files-found: ignore

  macos-capture-agent-tests:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      REACHES: '^(capture-agent/|fixtures/spool/|\.github/workflows/ci\.yml$)'
    steps:
      - id: reach
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          pr="repos/$GITHUB_REPOSITORY/pulls/$PR"
          if ! changed="$(gh api "$pr" --jq .changed_files)" || [ "$changed" -gt 3000 ] \
            || ! files="$(gh api --paginate "$pr/files" --jq '.[] | .filename, (.previous_filename // empty)')"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif grep -qE "$REACHES" <<<"$files"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Skipped::No changed file matches $REACHES"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.reach.outputs.run != 'false'
      - run: swift --version
        if: steps.reach.outputs.run != 'false'
      - run: capture-agent/scripts/test.sh
        if: steps.reach.outputs.run != 'false'
      - name: Release build of the signed app bundle, signed ad hoc
        if: steps.reach.outputs.run != 'false'
        run: CODESIGN_IDENTITY=- capture-agent/scripts/build.sh

  macos-capture-agent-e2e:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - run: |
          uv venv --python "$(command -v python)" .venv
          uv pip install --python .venv/bin/python -e '.[test,dev]'
      - run: capture-agent/scripts/e2e.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

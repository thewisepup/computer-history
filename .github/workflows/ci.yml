name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test,dev]'
      - run: python -m ruff check computer_history tests
      - run: python -m ruff format --check computer_history tests

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test,dev]'
      - run: python -m pytest -q tests/unit

  data:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test,dev]'
      - run: python -m pytest -q tests/data

  poc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test,dev]'
      - run: python -m unittest -q

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[test,dev]'
      - run: python -m pyright --pythonpath "$(command -v python)"

  perf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPUTER_HISTORY_DATASET_CACHE: /home/runner/.cache/computer-history/datasets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - id: runner
        run: |
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "sqlite=$(python -c 'import sqlite3; print(sqlite3.sqlite_version)')" >> "$GITHUB_OUTPUT"
      - id: datasets
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.COMPUTER_HISTORY_DATASET_CACHE }}
          key: datasets-${{ steps.runner.outputs.image }}-py${{ steps.python.outputs.python-version }}-sqlite${{ steps.runner.outputs.sqlite }}-${{ hashFiles('computer_history/**/*.py', 'computer_history/**/*.sql') }}
      - name: Performance gate
        run: |
          set -o pipefail
          computer-history dev perf --counters perf-counters.json | tee perf-gate.txt
      - if: failure()
        run: >-
          echo "::notice title=Performance gate::If the change of cost is intended, take this
          run's counters as the CI SQLite's baseline: gh run download ${{ github.run_id }}
          -n perf-counters -D /tmp/perf, then copy /tmp/perf/perf-counters.json to
          computer_history/synthetic/perf_baselines/ under the name the log's
          "Counters written" line gives, and run computer-history dev perf
          --update-baselines locally for your own SQLite."
      - if: "!cancelled() && steps.datasets.outputs.cache-hit != 'true' && hashFiles('perf-counters.json') != ''"
        uses: actions/cache/save@v4
        with:
          path: ${{ env.COMPUTER_HISTORY_DATASET_CACHE }}
          key: ${{ steps.datasets.outputs.cache-primary-key }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-counters
          path: |
            perf-counters.json
            perf-gate.txt
          if-no-files-found: ignore

  macos-capture-agent-tests:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: capture-agent/scripts/test.sh
      - name: Release build of the signed app bundle, signed ad hoc
        run: CODESIGN_IDENTITY=- capture-agent/scripts/build.sh

  macos-capture-agent-e2e:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e '.[test,dev]'
      - run: capture-agent/scripts/e2e.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      python: ${{ steps.reach.outputs.python }}
      e2e: ${{ steps.reach.outputs.e2e }}
      agent: ${{ steps.reach.outputs.agent }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/ci-changes
          sparse-checkout-cone-mode: false
      - id: reach
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          pr="repos/$GITHUB_REPOSITORY/pulls/$PR"
          if [ "$GITHUB_EVENT_NAME" != pull_request ] \
            || ! changed="$(gh api "$pr" --jq .changed_files)" || [ "$changed" -gt 3000 ] \
            || ! files="$(gh api --paginate "$pr/files" --jq '.[] | .filename, (.previous_filename // empty)')"; then
            files=""
          fi
          printf '%s\n' "$files" | python3 scripts/ci-changes | tee -a "$GITHUB_OUTPUT"

  lint:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - run: uv pip install --system -e '.[test,dev]'
      - run: python -m ruff check computer_history tests
      - run: python -m ruff format --check computer_history tests

  unit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - run: uv pip install --system -e '.[test,dev]'
      - run: python -m pytest -q -n auto tests/unit
        env:
          TMPDIR: /dev/shm

  data:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - run: uv pip install --system -e '.[test,dev]'
      - run: python -m pytest -q -n auto --dist worksteal tests/data

  poc:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - run: uv pip install --system -e '.[test,dev]'
      - run: python -m unittest -q

  typecheck:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - run: uv pip install --system -e '.[test,dev]'
      - run: python -m pyright --pythonpath "$(command -v python)"

  perf:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPUTER_HISTORY_DATASET_CACHE: /home/runner/.cache/computer-history/datasets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - run: uv pip install --system -e .
      - id: runner
        run: |
          echo "image=$ImageOS" >> "$GITHUB_OUTPUT"
          echo "sqlite=$(python -c 'import sqlite3; print(sqlite3.sqlite_version)')" >> "$GITHUB_OUTPUT"
      - id: datasets
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.COMPUTER_HISTORY_DATASET_CACHE }}
          key: datasets-${{ steps.runner.outputs.image }}-py${{ steps.python.outputs.python-version }}-sqlite${{ steps.runner.outputs.sqlite }}-${{ hashFiles('computer_history/**/*.py', 'computer_history/**/*.sql') }}
      - name: Performance gate
        run: |
          set -o pipefail
          computer-history dev perf --counters perf-counters.json | tee perf-gate.txt
        env:
          TMPDIR: /dev/shm
      - if: failure()
        run: >-
          echo "::notice title=Performance gate::If the change of cost is intended, take this
          run's counters as the CI SQLite's baseline: gh run download ${{ github.run_id }}
          -n perf-counters -D /tmp/perf, then copy /tmp/perf/perf-counters.json to
          computer_history/synthetic/perf_baselines/ under the name the log's
          "Counters written" line gives, and run computer-history dev perf
          --update-baselines locally for your own SQLite."
      - if: "!cancelled() && steps.datasets.outputs.cache-hit != 'true' && hashFiles('perf-counters.json') != ''"
        uses: actions/cache/save@v4
        with:
          path: ${{ env.COMPUTER_HISTORY_DATASET_CACHE }}
          key: ${{ steps.datasets.outputs.cache-primary-key }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-counters
          path: |
            perf-counters.json
            perf-gate.txt
          if-no-files-found: ignore

  macos-capture-agent-tests:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.agent != 'false' }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: capture-agent/scripts/test.sh
      - name: Release build of the signed app bundle, signed ad hoc
        run: CODESIGN_IDENTITY=- capture-agent/scripts/build.sh

  macos-capture-agent-e2e:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false
      - run: |
          uv venv --python "$(command -v python)" .venv
          uv pip install --python .venv/bin/python -e '.[test,dev]'
      - run: capture-agent/scripts/e2e.sh

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

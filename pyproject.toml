[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-history"
version = "0.1.0"
description = "Local activity store and ActivityWatch ingest, plus the original HTTP/MCP POC bridge"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp==2.3.0"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]
dev = ["watchfiles>=0.21,<2", "pytest>=8,<10", "ruff>=0.6,<1", "hypothesis>=6.100,<7", "mutmut>=3.8,<4"]

[project.scripts]
history = "history:main"
computer-history = "computer_history.cli:main"

[tool.setuptools]
py-modules = ["history", "history_mcp"]

[tool.setuptools.packages.find]
include = ["computer_history*"]

[tool.setuptools.package-data]
"computer_history.store" = ["migrations/*.sql"]
"computer_history.synthetic" = ["perf_baselines/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not perf'"
markers = [
    "perf: the performance gate, run with -m perf or computer-history dev perf",
    "schema_rule: guards a rule the SQL migrations enforce, which mutation testing cannot see",
]

[tool.mutmut]
source_paths = ["computer_history/"]
also_copy = ["fixtures/"]
pytest_add_cli_args_test_selection = [
    "tests/",
    "--ignore=tests/test_standards.py",
    "--ignore=tests/test_spool_fixture.py",
    "--ignore=tests/test_capture_e2e.py",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["history.py", "history_mcp.py", "test_history.py", "test_mcp.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

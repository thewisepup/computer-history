[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "computer-history-poc"
version = "0.1.0"
description = "Local HTTP and CLI bridge to ActivityWatch"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "mcp==2.3.0"]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
history = "history:main"

[tool.setuptools]
py-modules = ["history", "history_mcp"]
